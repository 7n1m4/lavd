[workspace]
members = [
    "animatab",
    "rust/scx_arena/scx_arena",
    "rust/scx_cargo",
    "rust/scx_stats",
    "rust/scx_stats/scx_stats_derive",
    "rust/scx_utils",
    "scheds/rust/scx_lavd",
]
default-members = ["scheds/rust/scx_lavd"]
resolver = "2"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = true
lto = false