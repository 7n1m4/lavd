name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -x {0}

env:
  BPF_CLANG: clang-19
  SCX_PACKAGES: "pkg-config lld clang clang-19 llvm-19 libelf-dev libzstd-dev protobuf-compiler libseccomp-dev libcap-ng-dev"
  RUSTFLAGS: "-C linker=clang"

jobs:
  lavd:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-deps-action
      - name: Format
        run: cargo fmt -- --check
      - name: Check LAVD
        run: cargo check --locked -p scx_lavd
      - name: Test LAVD
        run: cargo test --locked -p scx_lavd
      - name: Test Hyprland daemon example
        run: cargo test --locked --example anima_hypr_daemon -p scx_lavd
      - name: Build release LAVD
        run: cargo build --locked --release -p scx_lavd
      - name: Build release Hyprland daemon example
        run: cargo build --locked --release --example anima_hypr_daemon -p scx_lavd
      - name: Verify systemd user unit
        run: systemd-analyze verify --user services/anima-hypr.service
